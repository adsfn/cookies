:root{--bg:#fbf3e6;--ink:#3b2418;--muted:#7a5b48;--line:#e4cfb2;--acc:#e8b36a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* always the night bake, whatever the system preference */
:root[data-theme="dark"]{--bg:#1d1410;--ink:#f6e7d3;--muted:#c4a68c;--line:#3a2a20;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,4vw,48px)}

}
